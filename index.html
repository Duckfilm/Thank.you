<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias por tu compra</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap');
  
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    font-family: 'Fredoka', sans-serif;
  }

  .card {
    background: white;
    border-radius: 28px;
    padding: 50px 40px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 50% 0%, rgba(255,215,0,0.15), transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(0,200,83,0.15), transparent 50%);
    pointer-events: none;
  }

  .icon {
    font-size: 56px;
    margin-bottom: 12px;
    display: inline-block;
    animation: float 2.5s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }

  h1 {
    font-size: 32px;
    margin: 10px 0 5px;
    color: #111;
    letter-spacing: -0.5px;
  }

  .brand {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1.5px;
    margin: 10px 0;
  }

  .brand .duck {
    color: #FFC700;
    text-shadow: 2px 2px 0px #111;
  }

  .brand .film {
    color: #00C853;
    text-shadow: 2px 2px 0px #111;
  }

  p {
    color: #6b7280;
    font-size: 16px;
    line-height: 1.5;
    margin: 15px 0 28px;
  }

  .btn {
    display: inline-block;
    background: #111;
    color: white;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 100px;
    font-weight: 600;
    font-size: 16px;
    transition: all 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    background: #000;
  }

  .check {
    width: 64px;
    height: 64px;
    background: #00C853;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    color: white;
    font-size: 32px;
    box-shadow: 0 8px 20px rgba(0,200,83,0.3);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="check">✓</div>
    <div class="icon">🦆🎬</div>
    <h1>¡Gracias por tu compra!</h1>
    <div class="brand"><span class="duck">Duck</span><span class="film">Film</span></div>
    <p>Tu apoyo hace que sigamos creando. Tu pedido ya está en camino.</p>
    <a href="#" class="btn">Volver a DuckFilm</a>
  </div>

</body>
</html>
